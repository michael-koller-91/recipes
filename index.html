<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>recipes</title>
  <link rel="canonical" href="https://michael-koller-91.github.io/recipes/" />
  <link rel="manifest" href="/recipes/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/recipes/img/icon.jpg">
  <meta name="apple-mobile-web-app-title" content="recipes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <h1>Rezepte</h1>
  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register(
        '/recipes/sw.js',
        { scope: '/recipes/' }
      )
    }
  </script>

  <div id="recipe-list"></div>
  <button id="back-button" style="display: none;">← Zurück</button>
  <div id="factor-row" style="display: none;">
    <label for="factor">Faktor</label>
    <input id="factor" type="number" step="0.1" min="0.1" value="1">
  </div>
  <table class="recipe-table" id="recipe-table" style="display: none;"></table>

  <footer id="version"></footer>

  <script src="js/version.js"></script>
  <script>
    document.getElementById('version').textContent = 'v' + APP_VERSION;
  </script>
  <script src="js/app.js"></script>
</body>

</html>
