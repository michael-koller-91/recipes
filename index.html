<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>recipes</title>
  <link rel="canonical" href="https://michael-koller-91.github.io/recipes/" />
  <link rel="manifest" href="/recipes/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/recipes/img/icon.jpg">
  <meta name="apple-mobile-web-app-title" content="recipes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">

<body>

  <h1>Recipes</h1>
  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register(
        '/recipes/sw.js',
        { scope: '/recipes/' }
      )
    }
  </script>

  <table class="recipe-table">
    <tr>
      <th class="hcentered" colspan="3">Baked Oats</th>
    </tr>
    <tr>
      <td class="hcentered" colspan="3">kleine Auflaufform (optional einfetten)</td>
    </tr>
    <tr>
      <td>1 Banane</td>

    </tr>
    <tr>
      <td>1 TL Cashewmus</td>
      <td rowspan="4"></td>
    </tr>
    <tr>
      <td>50 g Haferflocken</td>
    </tr>
    <tr>
      <td>150 ml Milch</td>
    </tr>
    <tr>
      <td>1 Prise Salz</td>
    </tr>
    <tr>
      <td class="hcentered" colspan="3"> 20 Minuten Heißluftfritteuse bei 160 °C</td>
    </tr>
  </table>

  <footer id="version"></footer>

  <script src="js/version.js"></script>
  <script>
    document.getElementById('version').textContent = 'v' + APP_VERSION;
  </script>
  <script src="js/app.js"></script>
